<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Telu</title>
<link rel="icon" href="../kit/telu-icon.png">
<link id="theme" rel="stylesheet" href="../themes/default.css">
<link rel="stylesheet" href="../kit/mac-kit.css">
<link rel="stylesheet" href="island.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="doc.css">
</head>
<body>
<div class="desktop" id="desk">
  <div class="window t-app" id="win" tabindex="-1">
    <div class="traffic" id="traffic"><i data-act="win-close" aria-label="Close window"></i><i data-act="win-min" aria-label="Minimize"></i><i data-act="win-zoom" aria-label="Zoom"></i></div>
    <aside class="sidebar" id="sidebar"></aside>
    <section class="main" id="main">
      <div class="toolbar" id="toolbar"></div>
      <div class="content" id="content"><div id="view"></div></div>
      <aside class="peek" id="peek" aria-label="Side peek"></aside>
      <nav class="scrubber" id="scrubber" aria-label="Sections"></nav>
      <aside class="drawer" id="drawer" aria-label="Details"></aside>
    </section>
  </div>
  <section class="onboard" id="onboard" hidden role="dialog" aria-label="Set up Telu">
    <div class="ob-steps" id="obSteps"></div>
    <footer class="ob-foot"><div class="ob-dots" id="obDots"><i></i><i></i><i></i></div><span class="spacer"></span><div class="ob-actions" id="obActions"></div></footer>
  </section>
</div>
<script src="../kit/icons.js"></script>
<script src="../kit/data.js"></script>
<script src="../kit/mac-kit.js"></script>
<script src="island.js"></script>
<script src="app-model.js"></script>
<script src="app-data.js"></script>
<script src="doc-render.js"></script>
<script src="doc-past.js"></script>
<script src="app-shell.js"></script>
<script src="app-agenda.js"></script>
<script src="app-pages.js"></script>
<script src="app-peek.js"></script>
<script src="doc-page.js"></script>
<script src="doc-edit.js"></script>
<script src="doc-review.js"></script>
<script src="doc-organize.js"></script>
<script src="doc-popovers.js"></script>
<script src="app-actions.js"></script>
<script src="app-record.js"></script>
<script src="app-flows.js"></script>
<script src="app-onboard.js"></script>
<script src="app-bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
